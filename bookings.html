<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bookings | Kwa Olga</title>

</head>

<body>

    <header>

        <h1>
            Kwa Olga
        </h1>

        <nav>

            <ul>

                <li><a href="index.html">Home</a></li>

                <li><a href="about.html">About Us</a></li>

                <li><a href="bookings.html">Bookings</a></li>

                <li><a href="contact.html">Contact</a></li>

                <li><a href="events.html">Events</a></li>

                <li><a href="gallery.html">Gallery</a></li>

                <li><a href="location.html">Location</a></li>

                <li><a href="menu.html">Menu</a></li>

            </ul>

        </nav>

    </header>


    <main>

        <h1>
            Book Your Kwa Olga Experience
        </h1>

        <p>
            Complete the form below to request your booking.
        </p>


        <form>

            <label for="name">
                Full Name:
            </label>

            <input
                type="text"
                id="name"
                name="name"
                required
            >


            <br><br>


            <label for="vehicle">
                Vehicle Type:
            </label>

            <select id="vehicle" name="vehicle">

                <option value="">
                    Select Vehicle
                </option>

                <option value="sedan">
                    Sedan
                </option>

                <option value="hatchback">
                    Hatchback
                </option>

                <option value="suv">
                    SUV
                </option>

                <option value="bakkie">
                    Bakkie
                </option>

                <option value="other">
                    Other
                </option>

            </select>


            <br><br>


            <label for="service">
                Service:
            </label>

            <select id="service" name="service">

                <option value="">
                    Select Service
                </option>

                <option value="express">
                    Express Wash
                </option>

                <option value="executive">
                    Executive Valet
                </option>

                <option value="lifestyle">
                    Lifestyle Lounge
                </option>

            </select>


            <br><br>


            <label for="date">
                Preferred Date:
            </label>

            <input
                type="date"
                id="date"
                name="date"
            >


            <br><br>


            <label for="time">
                Preferred Time:
            </label>

            <input
                type="time"
                id="time"
                name="time"
            >


            <br><br>


            <button type="submit">
                Confirm Booking Request
            </button>

        </form>

    </main>


    <footer>

        <p>
            &copy; 2026 Kwa Olga. All Rights Reserved. ST10505914
        </p>

    </footer>

</body>

</html>
